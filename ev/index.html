<script>
document.getElementById('calcBtn').addEventListener('click', function () {
const extraPrice = extraPriceInput = document.getElementById('extraPrice').value * 10000;
const mileage = document.getElementById('mileage').value;
const gasEff = document.getElementById('gasEff').value;

const gasCostPerKm = 1700 / gasEff;
const evCostPerKm = 60;
const savingsPerYear = (gasCostPerKm - evCostPerKm) * mileage;
const years = extraPrice / savingsPerYear;

document.getElementById('result-area').style.display = 'block';
document.getElementById('result-years').textContent = `약 ${years.toFixed(1)}년`;
document.getElementById('result-text').textContent =
`매년 기름값으로 약 ${(savingsPerYear/10000).toFixed(0)}만 원을 아껴야 본전을 찾습니다.`;
});
