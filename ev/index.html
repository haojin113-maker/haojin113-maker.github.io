<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="전기차 보조금에 속지 마세요. 가솔린 차량 대비 실제 유지비와 감가상각을 포함한 손익분기점을 팩트로 계산해드립니다.">
    <title>전기차, 사지 마세요 | 팩트 폭격 연구소</title>

    <!-- 공통 모듈 -->
    <script src="../common.js"></script>

    <!-- 구글 아이콘 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Google AdSense (1회 로드) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6902579674102145"
        crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8f9fa; color: #333; line-height: 1.7; }

        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .main-content { flex: 3; min-width: 0; }
        .sidebar { flex: 1; min-width: 300px; position: sticky; top: 20px; }

        section {
            background: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid #eee;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        h1.page-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 20px 0 10px;
            color: #111;
        }

        p.page-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            border-left: 5px solid #2e7d32;
            padding-left: 15px;
            margin: 40px 0 20px;
            font-size: 1.5rem;
        }

        .intro-box {
            background: #f1f8e9;
            border: 1px solid #c5e1a5;
            padding: 25px;
            border-radius: 12px;
            color: #33691e;
        }

        .calc-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #2e7d32; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .calc-btn {
            width: 100%;
            padding: 18px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        #result-area {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: #f1f8e9;
            border-radius: 12px;
            text-align: center;
        }

        .highlight {
            font-size: 2.2rem;
            font-weight: 900;
            color: #1b5e20;
        }

        /* =====================
           광고 UX 최적화 영역
           ===================== */

        .ad-box {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 10px 0;
            margin: 25px 0;
            text-align: center;
        }

        .ad-label {
            font-size: 9px;
            color: #aaa;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ad-box.top-ad { margin-bottom: 35px; }
        .ad-box.bottom-ad { margin-top: 45px; }

        .sidebar-ad {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 12px;
        }

        @media (max-width: 850px) {
            .wrapper { flex-direction: column; }
            .sidebar { position: static; min-width: auto; }
            .ad-box { margin: 15px 0; }
        }
    </style>
</head>

<body>
<div class="wrapper">
    <main class="main-content">

        <h1 class="page-title">전기차, 지금 사면 손해인 이유</h1>
        <p class="page-subtitle">보조금에 홀려 차값으로 날리는 돈을 계산해드립니다.</p>

        <!-- 광고 #1 : 상단 흐름형 -->
        <div class="ad-box top-ad">
            <span class="ad-label">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-6902579674102145"
                 data-ad-slot="1234567890"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
        </div>

        <section class="intro-box">
            전기차가 경제적이라는 말, 과연 사실일까요?
        </section>

        <section id="calculator">
            <h2>⚡ 손익분기점 계산기</h2>

            <div class="calc-group">
                <label>동급 가솔린 대비 추가 비용 (만원)</label>
                <input type="number" id="extraPrice" value="1500">
            </div>

            <div class="calc-group">
                <label>연간 주행거리 (km)</label>
                <input type="number" id="mileage" value="15000">
            </div>

            <div class="calc-group">
                <label>가솔린 연비 (km/L)</label>
                <input type="number" id="gasEff" value="12">
            </div>

            <button class="calc-btn" id="calcBtn">본전 뽑는 기간 계산하기</button>

            <div id="result-area">
                <span id="result-years" class="highlight"></span>
                <p id="result-text"></p>
            </div>
        </section>

        <!-- 광고 #2 : 하단 완충형 -->
        <div class="ad-box bottom-ad">
            <span class="ad-label">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-6902579674102145"
                 data-ad-slot="9876543210"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
        </div>

    </main>

    <aside class="sidebar">
        <!-- 광고 #3 : 정보 위젯형 -->
        <div class="ad-box sidebar-ad">
            <span class="ad-label">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-6902579674102145"
                 data-ad-slot="5555555555"
                 data-ad-format="vertical"
                 data-full-width-responsive="true"></ins>
        </div>
    </aside>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    document.getElementById('calcBtn').addEventListener('click', function () {
        const extraPrice = document.getElementById('extraPrice').value * 10000;
        const mileage = document.getElementById('mileage').value;
        const gasEff = document.getElementById('gasEff').value;

        const gasCostPerKm = 1700 / gasEff;
        const evCostPerKm = 60;
        const savingsPerYear = (gasCostPerKm - evCostPerKm) * mileage;
        const years = extraPrice / savingsPerYear;

        document.getElementById('result-area').style.display = 'block';
        document.getElementById('result-years').textContent = `약 ${years.toFixed(1)}년`;
        document.getElementById('result-text').textContent =
            `매년 약 ${(savingsPerYear / 10000).toFixed(0)}만 원을 아껴야 본전입니다.`;
    });

    setTimeout(() => {
        document.querySelectorAll('.adsbygoogle').forEach(() => {
            try { (adsbygoogle = window.adsbygoogle || []).push({}); }
            catch (e) { console.error(e); }
        });
    }, 200);
});
</script>

</body>
</html>
